name: Refresh catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run refresh
      - run: npm run validate
      - run: npm test
      - name: Commit refreshed snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Refresh package catalog"
          git push
          # A GITHUB_TOKEN push deliberately starts no second workflow. The
          # checks above validated this exact generated tree, so report their
          # result on the commit the refresh just pushed.
          sha=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=success \
            -f context="Validate catalog" \
            -f description="Refresh workflow validated this catalog" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
