name: Package specs

# Run the Jasmine suite of every package this catalog lists, on every platform
# the editor ships for, against the ref a user would actually install: the
# newest stable semver tag the repository publishes, or `master` when it has
# never been tagged.
#
# The editor is built once per platform and handed to that platform's spec jobs
# as an artifact. Building it per package would cost an hour of runner time for
# every ten packages; building it once per platform costs it three times.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Packages to run, space- or comma-separated (globs allowed, e.g.
          "language-* linter"). Empty runs the whole catalog.
        required: false
        default: ""
      platforms:
        description: Platforms to run on, comma-separated.
        required: false
        default: ubuntu-latest,macos-latest,windows-latest
      shards:
        description: How many spec jobs to spread the catalog over, per platform.
        required: false
        default: "12"
      editor-ref:
        description: The lumine-code/lumine ref to build the editor from.
        required: false
        default: master
  schedule:
    # Daily. The catalog changes rarely but the packages it points at do not, so
    # the scheduled sweep is what catches a package a later editor commit broke.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One line per spec instead of dots: with a hundred suites in one log, a hang
  # has to point at the spec it hung on.
  LUMINE_JASMINE_REPORTER: list

jobs:
  plan:
    name: Resolve refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      platforms: ${{ steps.platforms.outputs.list }}
      editor-sha: ${{ steps.editor.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run validate
      # Pin the editor commit here, once, so all three platform builds and every
      # shard of every platform test the same editor. Resolving it per job would
      # let a push to the editor land mid-run and split the results.
      - name: Resolve the editor commit
        id: editor
        env:
          EDITOR_REF: ${{ inputs.editor-ref || 'master' }}
        run: |
          sha=$(git ls-remote https://github.com/lumine-code/lumine.git "$EDITOR_REF" | cut -f1)
          if [ -z "$sha" ]; then echo "No such editor ref: $EDITOR_REF" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Editor: lumine-code/lumine@$sha ($EDITOR_REF)" >> "$GITHUB_STEP_SUMMARY"
      - name: Select the platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms || 'ubuntu-latest,macos-latest,windows-latest' }}
        run: |
          list=$(node -e 'console.log(JSON.stringify(process.argv[1].split(",").map((p) => p.trim()).filter(Boolean)))' "$PLATFORMS")
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Resolve every catalog entry
        id: plan
        env:
          ONLY: ${{ inputs.packages }}
          SHARDS: ${{ inputs.shards || '12' }}
        run: |
          args=(--out plan.json --shards "$SHARDS")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          node scripts/plan-specs.js "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: spec-plan
          path: plan.json
          retention-days: 7
      # A catalog entry whose ref does not resolve is reported in the same shape
      # a shard reports a failing suite, so the summary job fails the run
      # without the other packages going untested.
      - uses: actions/upload-artifact@v6
        with:
          name: spec-results-plan
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  editor:
    name: Build the editor (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.platforms) }}
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          ref: ${{ needs.plan.outputs.editor-sha }}
          path: lumine
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      # npm records the @lumine-code git forks with ssh URLs, but the runners
      # have no ssh key. Rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # Not `--ignore-scripts`: node-pty is a TypeScript package whose `prepare`
      # emits `lib/`, and nothing later reproduces it. npm's allow-scripts gate
      # keeps everything absent from the editor's `allowScripts` list skipped.
      # Preparing the git-hosted forks is flaky on Windows, so retry.
      - name: Install editor dependencies
        working-directory: lumine
        shell: bash
        run: |
          install() { npm ci; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      # An artifact stores neither symlinks nor an executable bit, and the tree
      # holds both — `node_modules/.bin` and the Electron binary — so pack it
      # ourselves. Everything here is relative to the workspace: a Windows
      # runner's `tar` is GNU tar under bash and would read `D:\…` as an
      # option-bearing path. zstd where the image has it (all three do today),
      # gzip as the portable fallback.
      - name: Pack the built editor
        shell: bash
        run: |
          if command -v zstd >/dev/null 2>&1; then
            tar -I 'zstd -3 -T0' -cf lumine-editor.tar.zst lumine
          else
            tar -czf lumine-editor.tar.gz lumine
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: lumine-editor-${{ matrix.os }}
          path: lumine-editor.tar.*
          compression-level: 0
          retention-days: 1

  specs:
    # One job per platform per shard, each running its packages one at a time in
    # its own Electron session with a private LUMINE_HOME — the same isolation
    # the editor's own CI gives its bundled packages.
    name: Specs ${{ matrix.os }} ${{ matrix.shard }}
    needs: [plan, editor]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.platforms) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      # The catalog checkout goes first: `actions/checkout` cleans the workspace
      # it lands in, which would take the restored editor with it.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install headless-display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libsecret-1-0 fonts-noto-cjk
      - name: Use HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: actions/download-artifact@v6
        with:
          name: lumine-editor-${{ matrix.os }}
      - name: Unpack the built editor
        shell: bash
        run: |
          if [ -f lumine-editor.tar.zst ]; then
            tar -I zstd -xf lumine-editor.tar.zst
          else
            tar -xzf lumine-editor.tar.gz
          fi
          rm -f lumine-editor.tar.*
      - uses: actions/download-artifact@v6
        with:
          name: spec-plan
      - name: Run this shard's package specs
        shell: bash
        run: node scripts/run-specs.js --plan plan.json --shard ${{ matrix.shard }} --editor lumine
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spec-results-${{ matrix.os }}-${{ matrix.shard }}
          path: results/
          retention-days: 7

  summary:
    name: Summary
    needs: [plan, specs]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v6
        with:
          name: spec-plan
      # Each platform's shards upload their own artifact, and their file names
      # collide across platforms — keep them in sibling directories.
      - uses: actions/download-artifact@v6
        with:
          pattern: spec-results-*
          path: results
      # The only step that fails the run. Every shard reports whatever it got
      # through, so one broken package never hides the ones behind it, and the
      # plan is what proves a shard that died did not just go quiet.
      - name: Report
        run: node scripts/summarize-specs.js --results results --plan plan.json
